{% extends "base.html" %}
{% block title %}Settings &mdash; CodeVision {% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 680px;">
    <div class="cv-card p-4">
        <h4 class="text-light fw-bold mb-3"><i class="fas fa-cog me-2 text-warning"></i>User & Editor Settings</h4>
        
        <form id="settings-form">
            <div class="mb-3">
                <label class="text-secondary small fw-bold mb-1">Editor Font Size (px)</label>
                <input type="number" id="font-size" class="cv-input" min="10" max="24" value="14">
            </div>
            <div class="mb-3">
                <label class="text-secondary small fw-bold mb-1">Default Programming Language</label>
                <select id="default-lang" class="cv-select">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="cpp">C++</option>
                    <option value="java">Java</option>
                    <option value="c">C</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="text-secondary small fw-bold mb-1">Editor Tab Size</label>
                <select id="tab-size" class="cv-select">
                    <option value="4">4 spaces</option>
                    <option value="2">2 spaces</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="text-secondary small fw-bold mb-1">Visualizer Animation Speed</label>
                <select id="viz-speed" class="cv-select">
                    <option value="1x">1x Normal</option>
                    <option value="1.5x">1.5x Fast</option>
                    <option value="2x">2x Very Fast</option>
                </select>
            </div>
            <button type="button" class="cv-btn cv-btn-primary w-100" onclick="saveSettings()">Save Preferences</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function saveSettings() {
    const data = {
        editor_font_size: parseInt(document.getElementById('font-size').value),
        default_language: document.getElementById('default-lang').value,
        tab_size: parseInt(document.getElementById('tab-size').value),
        visualizer_speed: document.getElementById('viz-speed').value
    };
    const res = await CodeVision.api('/api/settings', {
        method: 'POST',
        body: JSON.stringify(data)
    });
    if (res.success) {
        CodeVision.toast('Settings saved successfully!', 'success');
    }
}
</script>
{% endblock %}
