{% extends "base.html" %}
{% block title %}Manage Users &mdash; Admin{% endblock %}

{% block content %}
<div class="admin-layout">
    <div class="admin-sidebar">
        <h6 class="text-warning fw-bold px-2 mb-3"><i class="fas fa-shield-alt me-2"></i>Admin Console</h6>
        <a href="/admin" class="admin-nav-item"><i class="fas fa-chart-line"></i>Overview</a>
        <a href="/admin/problems" class="admin-nav-item"><i class="fas fa-code"></i>Manage Problems</a>
        <a href="/admin/testcases" class="admin-nav-item"><i class="fas fa-vial"></i>Test Cases</a>
        <a href="/admin/users" class="admin-nav-item active"><i class="fas fa-users"></i>Manage Users</a>
        <a href="/admin/analytics" class="admin-nav-item"><i class="fas fa-chart-bar"></i>System Analytics</a>
    </div>
    <div class="admin-content">
        <h3 class="text-light fw-bold mb-4">User Management</h3>
        <div class="cv-card p-0 overflow-hidden">
            <table class="table table-dark table-hover mb-0 align-middle">
                <thead><tr class="text-secondary small"><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Points</th><th>Streak</th></tr></thead>
                <tbody id="adm-users-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const res = await CodeVision.api('/admin/api/users');
    const tbody = document.getElementById('adm-users-tbody');
    if (res.success && res.users) {
        tbody.innerHTML = '';
        res.users.forEach(u => {
            tbody.innerHTML += `
                <tr>
                    <td class="font-monospace">${u.id}</td>
                    <td class="text-light fw-semibold">${u.username}</td>
                    <td class="text-secondary small">${u.email}</td>
                    <td><span class="badge ${u.role === 'admin' ? 'bg-danger' : 'bg-secondary'}">${u.role}</span></td>
                    <td class="text-warning font-monospace">${u.points}</td>
                    <td>${u.current_streak}d</td>
                </tr>
            `;
        });
    }
});
</script>
{% endblock %}
