{% extends "base.html" %}
{% block title %}Manage Problems &mdash; Admin{% endblock %}

{% block content %}
<div class="admin-layout">
    <div class="admin-sidebar">
        <h6 class="text-warning fw-bold px-2 mb-3"><i class="fas fa-shield-alt me-2"></i>Admin Console</h6>
        <a href="/admin" class="admin-nav-item"><i class="fas fa-chart-line"></i>Overview</a>
        <a href="/admin/problems" class="admin-nav-item active"><i class="fas fa-code"></i>Manage Problems</a>
        <a href="/admin/testcases" class="admin-nav-item"><i class="fas fa-vial"></i>Test Cases</a>
        <a href="/admin/users" class="admin-nav-item"><i class="fas fa-users"></i>Manage Users</a>
        <a href="/admin/analytics" class="admin-nav-item"><i class="fas fa-chart-bar"></i>System Analytics</a>
    </div>
    <div class="admin-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-light fw-bold mb-0">Problem Management</h3>
            <a href="/admin/problems/new" class="cv-btn cv-btn-primary cv-btn-sm"><i class="fas fa-plus me-1"></i>Add New Problem</a>
        </div>
        <div class="cv-card p-0 overflow-hidden">
            <table class="table table-dark table-hover mb-0 align-middle">
                <thead><tr class="text-secondary small"><th>ID</th><th>Title</th><th>Difficulty</th><th>Topic</th><th>Actions</th></tr></thead>
                <tbody id="adm-problems-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const res = await CodeVision.api('/api/problems');
    const tbody = document.getElementById('adm-problems-tbody');
    if (res.success && res.problems) {
        tbody.innerHTML = '';
        res.problems.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td class="font-monospace">${p.id}</td>
                    <td><a href="/problems/${p.slug}" class="text-light fw-semibold">${p.title}</a></td>
                    <td><span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span></td>
                    <td><span class="badge-topic">${p.topic}</span></td>
                    <td>
                        <a href="/admin/problems/${p.id}/edit" class="cv-btn cv-btn-secondary cv-btn-sm me-1"><i class="fas fa-edit"></i></a>
                        <button class="cv-btn cv-btn-danger cv-btn-sm" onclick="deleteAdminProblem(${p.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }
});
</script>
{% endblock %}
