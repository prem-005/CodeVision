{% extends "base.html" %}
{% block title %}Manage Contests &mdash; Admin{% endblock %}
{% block content %}
<div class="admin-layout">
    <div class="admin-sidebar">
        <h6 class="text-warning fw-bold px-2 mb-3"><i class="fas fa-shield-alt me-2"></i>Admin Console</h6>
        <a href="/admin" class="admin-nav-item"><i class="fas fa-chart-line"></i>Overview</a>
        <a href="/admin/problems" class="admin-nav-item"><i class="fas fa-code"></i>Manage Problems</a>
        <a href="/admin/testcases" class="admin-nav-item"><i class="fas fa-vial"></i>Test Cases</a>
        <a href="/admin/users" class="admin-nav-item"><i class="fas fa-users"></i>Manage Users</a>
        <a href="/admin/contests" class="admin-nav-item active"><i class="fas fa-trophy"></i>Contests</a>
        <a href="/admin/analytics" class="admin-nav-item"><i class="fas fa-chart-bar"></i>System Analytics</a>
    </div>
    <div class="admin-content">
        <h3 class="text-light fw-bold mb-4">Contest Management</h3>
        <div class="cv-card p-0 overflow-hidden">
            <table class="table table-dark table-hover mb-0 align-middle">
                <thead><tr class="text-secondary small"><th>ID</th><th>Title</th><th>Duration</th><th>Difficulty</th><th>Actions</th></tr></thead>
                <tbody id="adm-contests-tbody"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const res = await CodeVision.api('/api/contests');
    const tbody = document.getElementById('adm-contests-tbody');
    if (res.success && res.contests) {
        tbody.innerHTML = '';
        res.contests.forEach(c => {
            tbody.innerHTML += `
                <tr>
                    <td class="font-monospace">${c.id}</td>
                    <td class="text-light fw-semibold">${c.title}</td>
                    <td>${c.duration_minutes} min</td>
                    <td><span class="badge badge-${c.difficulty.toLowerCase()}">${c.difficulty}</span></td>
                    <td><a href="/contests/${c.slug}" class="cv-btn cv-btn-secondary cv-btn-sm"><i class="fas fa-eye"></i></a></td>
                </tr>
            `;
        });
    }
});
</script>
{% endblock %}
