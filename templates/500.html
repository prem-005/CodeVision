{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
    <i class="fa-solid fa-bug text-danger display-1 mb-3"></i>
    <h1 class="display-4 fw-bold text-light mb-2">500 - Internal Error</h1>
    <p class="text-secondary lead mb-4">{{ message or "An internal server error occurred while processing your request." }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-warning btn-lg rounded-pill fw-bold px-4">
        <i class="fa-solid fa-rotate-right me-2"></i>Reload Home
    </a>
</div>
{% endblock %}
