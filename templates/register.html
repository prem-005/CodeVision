{% extends "base.html" %}
{% block title %}Register &mdash; CodeVision {% endblock %}

{% block content %}
<div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 160px);">
    <div class="cv-card p-4 p-md-5" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fas fa-user-plus fa-2x text-warning mb-2"></i>
            <h3 class="text-light fw-bold">Create Account</h3>
            <p class="text-secondary small">Join CodeVision to master coding, DSA, and projects</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2 px-3 small">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Username</label>
                <input type="text" name="username" class="cv-input" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-secondary small fw-semibold">Email Address</label>
                <input type="email" name="email" class="cv-input" placeholder="name@domain.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-semibold">Password</label>
                <input type="password" name="password" class="cv-input" placeholder="Create strong password" required>
            </div>
            <button type="submit" class="cv-btn cv-btn-primary w-100 py-2">Create Account</button>
        </form>

        <div class="mt-4 pt-3 border-top border-dark text-center">
            <span class="text-secondary small">Already have an account? <a href="/login" class="text-warning">Login</a></span>
        </div>
    </div>
</div>
{% endblock %}
