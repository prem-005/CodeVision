{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
    <i class="fa-solid fa-triangle-exclamation text-warning display-1 mb-3"></i>
    <h1 class="display-4 fw-bold text-light mb-2">404 - Page Not Found</h1>
    <p class="text-secondary lead mb-4">{{ message or "The page or problem resource you requested could not be located." }}</p>
    <a href="{{ url_for('problems.problems_page') }}" class="btn btn-warning btn-lg rounded-pill fw-bold px-4">
        <i class="fa-solid fa-arrow-left me-2"></i>Back to Problems
    </a>
</div>
{% endblock %}
