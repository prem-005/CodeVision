{% extends "base.html" %}
{% block title %}Project Lab &mdash; CodeVision {% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
            <h2 class="text-light fw-bold mb-1">Project Lab</h2>
            <p class="text-secondary mb-0">Master software engineering by building real-world systems, APIs, and automation engines.</p>
        </div>
    </div>

    <!-- Category Filter -->
    <div class="cv-card p-3 mb-4">
        <div class="row g-2">
            <div class="col-md-6">
                <select id="proj-diff-filter" class="cv-select">
                    <option value="all">All Difficulties</option>
                    <option value="Beginner">Beginner (CRUD & Basics)</option>
                    <option value="Intermediate">Intermediate (APIs & Systems)</option>
                    <option value="Advanced">Advanced (High Throughput & Distributed)</option>
                </select>
            </div>
            <div class="col-md-6">
                <select id="proj-cat-filter" class="cv-select">
                    <option value="all">All Categories</option>
                    <option value="Software Engineering">Software Engineering</option>
                    <option value="Automation">Automation & Data</option>
                    <option value="Backend">Backend & Systems</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Project Cards Grid -->
    <div class="row g-4" id="projects-grid">
        <div class="col-12 text-center py-4 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Loading projects...</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadProjects() {
    const diff = document.getElementById('proj-diff-filter').value;
    const cat = document.getElementById('proj-cat-filter').value;
    const res = await CodeVision.api(`/api/projects?difficulty=${diff}&category=${cat}`);
    const grid = document.getElementById('projects-grid');

    if (res.success && res.projects) {
        grid.innerHTML = '';
        res.projects.forEach(p => {
            const skills = (p.skills_covered || []).map(s => `<span class="badge-topic me-1">${s}</span>`).join('');
            grid.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="cv-card cv-card-interactive h-100 d-flex flex-column p-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span>
                            <span class="text-warning small fw-bold">+${p.points_reward} pts</span>
                        </div>
                        <h5 class="text-light fw-bold mb-2">${p.title}</h5>
                        <p class="text-secondary small flex-grow-1 mb-3">${p.description}</p>
                        <div class="mb-3">${skills}</div>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top border-dark">
                            <span class="text-muted small">${p.milestones.length} Milestones</span>
                            <a href="/projects/${p.slug}" class="cv-btn cv-btn-primary cv-btn-sm">Enter Lab</a>
                        </div>
                    </div>
                </div>
            `;
        });
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadProjects();
    document.getElementById('proj-diff-filter').addEventListener('change', loadProjects);
    document.getElementById('proj-cat-filter').addEventListener('change', loadProjects);
});
</script>
{% endblock %}
